<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>計算小工具</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="card">
    <h1>計算小工具</h1>
    <p class="hint">輸入兩個數字，就會自動計算四則運算的結果。</p>

    <div class="row">
      <input id="a" type="text" inputmode="decimal" placeholder="第一個數字" />
      <input id="b" type="text" inputmode="decimal" placeholder="第二個數字" />
    </div>
    <div id="addResult" class="result muted">加法結果會顯示在這裡</div>
    <div id="subResult" class="result muted">減法結果會顯示在這裡</div>
    <div id="mulResult" class="result muted">乘法結果會顯示在這裡</div>
    <div id="divResult" class="result muted">除法結果會顯示在這裡</div>

    <div class="footer small">Tip：也支援小數點與逗號（, 會自動轉成 .）</div>
  </div>

  <script src="code.js"></script>

</body>
</html>
